# Sample workflow for building and deploying a mdBook site to GitHub Pages
#
# To get started with mdBook see: https://rust-lang.github.io/mdBook/index.html
#
name: Deploy mdBook site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.2
      MDBOOK_GRAPHVIZ_VERSION: 0.3.1
      MDBOOK_I18N_HELPERS_VERSION: 0.4.0
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz
          cargo install --locked --version "${MDBOOK_VERSION}" mdbook
          cargo install --locked --version "${MDBOOK_GRAPHVIZ_VERSION}" mdbook-graphviz
          cargo install --locked --version "${MDBOOK_I18N_HELPERS_VERSION}" mdbook-i18n-helpers
      - name: Lint sources
        run: python3 tools/lint.py src
      - name: Test Rust code blocks
        run: mdbook test
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with mdBook
        run: mdbook build
      - name: Check site layout
        # Pages serves ./book as the site root. A second [output.*] renderer
        # makes mdBook nest the HTML under book/html/, which deploys "fine"
        # but leaves the root returning 404.
        run: |
          test -f book/index.html || { echo "::error::book/index.html missing"; ls book; exit 1; }
          test ! -d book/html || { echo "::error::HTML was built into book/html/"; exit 1; }
          grep -q "Rust Edition" book/index.html || { echo "::error::book/index.html is not the book"; exit 1; }
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check live site
        # Retry for a few minutes while the Pages CDN picks up the deployment.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsSL "$PAGE_URL" | grep -q "Rust Edition"; then
              echo "$PAGE_URL is live"
              exit 0
            fi
            echo "Attempt $attempt: $PAGE_URL not serving the book yet"
            sleep 30
          done
          echo "::error::$PAGE_URL did not serve the book after deploy"
          exit 1
