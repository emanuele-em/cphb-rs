[book]
authors = ["emanuele-em"]
language = "en"
src = "src"
title = "Competitive Programmer's Handbook - Rust Edition"

[output.html]
additional-css = ["assets/css/custom.css"]
mathjax-support = true

[preprocessor.graphviz]
command = "mdbook-graphviz"

[preprocessor.gettext]
after = ["links"]

[build]
extra-watch-dirs = ["po"]

[output.xgettext]
pot-file = "po/messages.pot"
